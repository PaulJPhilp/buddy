<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Machine Test</title>
  <!-- Load React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Load XState - make sure this loads before our script -->
  <script src="https://cdn.jsdelivr.net/npm/xstate@5.5.1/dist/xstate.umd.production.min.js" crossorigin></script>
  
  <!-- Load Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Verify XState loaded correctly -->
  <script>
    window.onload = function() {
      console.log('XState loaded:', typeof XState !== 'undefined');
      console.log('XState version:', XState?.version);
    }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      line-height: 1.6;
      color: #333;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    .container {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
    }
    .message-list {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #eee;
      padding: 10px;
      margin-bottom: 20px;
    }
    .message {
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .user-message {
      background-color: #e3f2fd;
      margin-left: 20px;
    }
    .assistant-message {
      background-color: #f1f8e9;
      margin-right: 20px;
    }
    .system-message {
      background-color: #f5f5f5;
    }
    .input-container {
      display: flex;
      margin-bottom: 20px;
    }
    input {
      flex-grow: 1;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px 0 0 4px;
    }
    button {
      padding: 8px 16px;
      background-color: #1976d2;
      color: white;
      border: none;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
    }
    button:disabled {
      background-color: #bdbdbd;
    }
    .status-panel {
      background-color: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    .test-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .test-button {
      padding: 8px 16px;
      background-color: #f5f5f5;
      color: #333;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
    }
    .error {
      color: #d32f2f;
      background-color: #ffebee;
      padding: 8px;
      border-radius: 4px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>XState v5 Chat Machine Test</h1>
  <p>This is a standalone test for the chat machine using XState v5.</p>
  
  <div id="root"></div>

  <script type="text/babel">
    // Simple mock implementation of the chat machine for testing
    const createChatMachine = (initialContext = {}) => {
      return XState.createMachine({
        id: 'chat',
        initial: 'idle',
        context: {
          messages: initialContext.messages || [],
          error: null,
          isTyping: false,
          lastMessageId: null
        },
        states: {
          idle: {
            on: {
              SEND: {
                target: 'sending',
                actions: 'addUserMessage'
              },
              RECEIVE: {
                actions: 'addMessage'
              },
              SET_TYPING: {
                actions: 'setTyping'
              }
            }
          },
          sending: {
            entry: 'setTyping',
            invoke: {
              src: 'sendMessage',
              onDone: {
                target: 'idle',
                actions: ['addResponseMessage', 'onMessageSent']
              },
              onError: {
                target: 'error',
                actions: 'setError'
              }
            }
          },
          error: {
            on: {
              CLEAR_ERROR: {
                target: 'idle',
                actions: 'clearError'
              },
              SEND: {
                target: 'sending',
                actions: ['clearError', 'addUserMessage']
              }
            }
          }
        }
      }, {
        actions: {
          addUserMessage: XState.assign({
            messages: ({ context, event }) => [
              ...context.messages,
              {
                id: `user-${Date.now()}`,
                role: 'user',
                content: event.content,
                timestamp: new Date().toISOString()
              }
            ]
          }),
          addResponseMessage: XState.assign({
            messages: ({ context, event }) => [
              ...context.messages,
              event.output
            ]
          }),
          addMessage: XState.assign({
            messages: ({ context, event }) => [
              ...context.messages,
              event.message
            ]
          }),
          setTyping: XState.assign({
            isTyping: (_, event) => event.type === 'SET_TYPING' ? event.value : true
          }),
          onMessageSent: XState.assign({
            lastMessageId: ({ event }) => event.output?.id,
            isTyping: false
          }),
          setError: XState.assign({
            error: (_, event) => event.error
          }),
          clearError: XState.assign({
            error: null
          })
        }
      });
    };

    // Simple hook to use the chat machine
    const useChatMachine = ({ initialMessages = [], onSendMessage }) => {
      const chatMachine = React.useMemo(() => {
        return createChatMachine({ messages: initialMessages });
      }, []);

      const [state, send] = XState.useMachine(chatMachine, {
        actors: {
          sendMessage: XState.fromPromise(async ({ input }) => {
            if (onSendMessage) {
              return await onSendMessage(input.content);
            }
            throw new Error('No message handler provided');
          })
        }
      });

      const sendMessage = React.useCallback((content) => {
        send({ type: 'SEND', content });
      }, [send]);

      const receiveMessage = React.useCallback((message) => {
        send({ type: 'RECEIVE', message });
      }, [send]);

      const setTyping = React.useCallback((value) => {
        send({ type: 'SET_TYPING', value });
      }, [send]);

      const clearError = React.useCallback(() => {
        send({ type: 'CLEAR_ERROR' });
      }, [send]);

      return {
        messages: state.context.messages,
        error: state.context.error,
        isTyping: state.context.isTyping,
        status: state.value,
        sendMessage,
        receiveMessage,
        setTyping,
        clearError
      };
    };

    // Chat machine test component
    function ChatMachineTest() {
      const [input, setInput] = React.useState('');
      
      const {
        messages,
        error,
        isTyping,
        status,
        sendMessage,
        receiveMessage,
        setTyping,
        clearError
      } = useChatMachine({
        initialMessages: [
          {
            id: 'system-1',
            role: 'system',
            content: 'This is a test of the chat machine.',
            timestamp: new Date().toISOString()
          }
        ],
        onSendMessage: async (content) => {
          console.log('Sending message:', content);
          
          // Simulate a delay for network request
          await new Promise(resolve => setTimeout(resolve, 1000));
          
          // Return a mock response
          return {
            id: `response-${Date.now()}`,
            role: 'assistant',
            content: `You said: "${content}"`,
            timestamp: new Date().toISOString()
          };
        }
      });
      
      // Handle form submission
      const handleSubmit = (e) => {
        e.preventDefault();
        if (input.trim()) {
          sendMessage(input);
          setInput('');
        }
      };
      
      // Simulate typing indicator
      const handleSimulateTyping = () => {
        setTyping(true);
        setTimeout(() => setTyping(false), 3000);
      };
      
      // Simulate receiving a message
      const handleReceiveMessage = () => {
        const message = {
          id: `received-${Date.now()}`,
          role: 'assistant',
          content: 'This is a simulated received message.',
          timestamp: new Date().toISOString()
        };
        receiveMessage(message);
      };
      
      // Convert status to string for display and comparison
      const statusString = typeof status === 'string' ? status : JSON.stringify(status);
      
      // Log state changes for debugging
      React.useEffect(() => {
        console.log('Chat machine state:', { messages, error, isTyping, status: statusString });
      }, [messages, error, isTyping, statusString]);
      
      return (
        <div className="container">
          <h2>Chat Machine Test</h2>
          
          {/* Status display */}
          <div className="status-panel">
            <p><strong>Status:</strong> {statusString}</p>
            <p><strong>Is Typing:</strong> {isTyping ? 'Yes' : 'No'}</p>
            {error && (
              <div className="error">
                <strong>Error:</strong> {error.message}
              </div>
            )}
          </div>
          
          {/* Messages display */}
          <div className="message-list">
            <h3>Messages:</h3>
            {messages.length === 0 ? (
              <p>No messages yet</p>
            ) : (
              <div>
                {messages.map(message => (
                  <div 
                    key={message.id} 
                    className={`message ${
                      message.role === 'user' 
                        ? 'user-message' 
                        : message.role === 'assistant' 
                          ? 'assistant-message' 
                          : 'system-message'
                    }`}
                  >
                    <div><strong>{message.role}</strong></div>
                    <div>{message.content}</div>
                    <div style={{ fontSize: '0.8em', color: '#666' }}>
                      {new Date(message.timestamp).toLocaleTimeString()}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
          
          {/* Input form */}
          <form onSubmit={handleSubmit}>
            <div className="input-container">
              <input
                type="text"
                value={input}
                onChange={e => setInput(e.target.value)}
                placeholder="Type a message..."
              />
              <button 
                type="submit" 
                disabled={statusString === 'sending'}
              >
                {statusString === 'sending' ? 'Sending...' : 'Send'}
              </button>
            </div>
          </form>
          
          {/* Test buttons */}
          <div className="test-buttons">
            <button
              onClick={handleSimulateTyping}
              className="test-button"
            >
              Simulate Typing
            </button>
            <button
              onClick={handleReceiveMessage}
              className="test-button"
            >
              Simulate Receive Message
            </button>
            {error && (
              <button
                onClick={clearError}
                className="test-button"
                style={{ backgroundColor: '#ffcdd2' }}
              >
                Clear Error
              </button>
            )}
          </div>
        </div>
      );
    }

    // Render the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ChatMachineTest />);
  </script>
</body>
</html>
