<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal XState Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
    }
    pre {
      background-color: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
      max-width: 100%;
    }
    button {
      padding: 8px 16px;
      margin: 5px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .output {
      margin-top: 20px;
      padding: 15px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Minimal XState Test</h1>
  
  <div>
    <button id="checkBtn">Check XState</button>
    <button id="toggleBtn">Toggle State</button>
  </div>
  
  <div class="output">
    <h3>Status</h3>
    <pre id="status">Checking XState...</pre>
  </div>
  
  <div class="output">
    <h3>State</h3>
    <pre id="stateOutput">Waiting for state...</pre>
  </div>
  
  <!-- Load XState with script tag -->
  <script>
    // Check if XState is already loaded
    document.getElementById('status').textContent = 'XState global check: ' + 
      (typeof window.XState !== 'undefined' ? 'Available' : 'Not available');
  </script>
  
  <!-- Load XState from multiple CDNs for redundancy -->
  <script src="https://unpkg.com/xstate@5/dist/xstate.umd.production.min.js"></script>
  
  <script>
    // Function to run once the page is loaded
    window.onload = function() {
      const statusEl = document.getElementById('status');
      const stateOutputEl = document.getElementById('stateOutput');
      const checkBtn = document.getElementById('checkBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      
      // Check if XState is available
      if (typeof window.XState === 'undefined') {
        statusEl.textContent = 'Error: XState not loaded! Trying alternative source...';
        
        // Try loading from another source
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/xstate@5.5.1/dist/xstate.umd.production.min.js';
        script.onload = initXState;
        script.onerror = function() {
          statusEl.textContent = 'Failed to load XState from all sources.';
        };
        document.head.appendChild(script);
      } else {
        initXState();
      }
      
      // Initialize XState functionality
      function initXState() {
        try {
          if (typeof window.XState === 'undefined') {
            statusEl.textContent = 'Error: XState still not available after loading attempts.';
            return;
          }
          
          statusEl.textContent = 'XState loaded successfully! Version: ' + window.XState.version;
          console.log('XState loaded:', window.XState.version);
          
          // Create a simple toggle machine
          const toggleMachine = window.XState.createMachine({
            id: 'toggle',
            initial: 'inactive',
            context: {
              count: 0
            },
            states: {
              inactive: {
                on: { 
                  TOGGLE: {
                    target: 'active',
                    actions: 'increment'
                  }
                }
              },
              active: {
                on: { 
                  TOGGLE: {
                    target: 'inactive',
                    actions: 'increment'
                  }
                }
              }
            }
          }, {
            actions: {
              increment: window.XState.assign({
                count: ({ context }) => context.count + 1
              })
            }
          });
          
          // Create actor
          const toggleActor = window.XState.createActor(toggleMachine);
          toggleActor.start();
          
          // Update state display
          toggleActor.subscribe(state => {
            stateOutputEl.textContent = JSON.stringify({
              value: state.value,
              context: state.context
            }, null, 2);
          });
          
          // Button handlers
          checkBtn.addEventListener('click', () => {
            statusEl.textContent = 'XState is working! Version: ' + window.XState.version;
          });
          
          toggleBtn.addEventListener('click', () => {
            toggleActor.send({ type: 'TOGGLE' });
          });
        } catch (error) {
          statusEl.textContent = 'Error initializing XState: ' + error.message;
          console.error('XState error:', error);
        }
      }
    };
  </script>
</body>
</html>
