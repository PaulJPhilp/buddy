<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XState Simple Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
    }
    pre {
      background-color: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }
    button {
      padding: 8px 16px;
      margin: 5px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .output {
      margin-top: 20px;
      padding: 15px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>XState Simple Test</h1>
  
  <div>
    <button id="testBtn">Test XState</button>
    <button id="toggleBtn">Toggle State</button>
  </div>
  
  <div class="output">
    <h3>Status</h3>
    <pre id="status">Loading...</pre>
  </div>
  
  <div class="output">
    <h3>State</h3>
    <pre id="stateOutput">Waiting for state...</pre>
  </div>
  
  <!-- Load XState from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/xstate@5.5.1/dist/xstate.umd.production.min.js"></script>
  
  <script>
    // Wait for page to load
    document.addEventListener('DOMContentLoaded', function() {
      const statusEl = document.getElementById('status');
      const stateOutputEl = document.getElementById('stateOutput');
      const testBtn = document.getElementById('testBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      
      // Check if XState loaded
      if (typeof XState === 'undefined') {
        statusEl.textContent = 'Error: XState not loaded!';
        console.error('XState not loaded');
        return;
      }
      
      // Show XState version
      statusEl.textContent = `XState loaded successfully! Version: ${XState.version}`;
      console.log('XState loaded:', XState.version);
      
      // Create a simple toggle machine
      const toggleMachine = XState.createMachine({
        id: 'toggle',
        initial: 'inactive',
        context: {
          count: 0
        },
        states: {
          inactive: {
            on: { 
              TOGGLE: {
                target: 'active',
                actions: 'increment'
              }
            }
          },
          active: {
            on: { 
              TOGGLE: {
                target: 'inactive',
                actions: 'increment'
              }
            }
          }
        }
      }, {
        actions: {
          increment: XState.assign({
            count: ({ context }) => context.count + 1
          })
        }
      });
      
      // Create actor
      let toggleActor;
      
      try {
        toggleActor = XState.createActor(toggleMachine);
        toggleActor.start();
        
        // Update state display
        toggleActor.subscribe(state => {
          stateOutputEl.textContent = JSON.stringify({
            value: state.value,
            context: state.context
          }, null, 2);
        });
        
        // Button handlers
        testBtn.addEventListener('click', () => {
          statusEl.textContent = `XState is working! Version: ${XState.version}`;
        });
        
        toggleBtn.addEventListener('click', () => {
          toggleActor.send({ type: 'TOGGLE' });
        });
      } catch (error) {
        statusEl.textContent = `Error initializing XState: ${error.message}`;
        console.error('XState error:', error);
      }
    });
  </script>
</body>
</html>
